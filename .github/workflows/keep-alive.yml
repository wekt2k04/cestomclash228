name: Keep backend alive

# Render (plan gratuit) met le process NestJS en veille apres ~15 min sans
# requete - le reveil (cold start) peut prendre plusieurs dizaines de
# secondes, pendant lesquelles le front (auth-context.tsx::hydrate) reste
# bloque sur /auth/me. Ping regulier plutot que de laisser chaque premier
# visiteur de la journee payer ce cout. Planifie dans le plan de deploiement
# d'origine (zesty-knitting-biscuit.md, section 4.7), jamais mis en place
# jusqu'ici.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /health
        run: curl -fsS --max-time 55 https://cestomclash228.onrender.com/health
