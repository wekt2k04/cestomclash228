<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Toggle Ghost Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a0704; --bg-elevated: #24130f; --bg-card: #2c1c17;
    --line: #63453a8c; --ink: #f6f1eb; --ink-muted: #b8a79c; --ink-faint: #7f716a;
    --terracotta: #ed7940; --terracotta-ink: #120805;
    --red: #e9504d; --gold: #eab532; --green: #3aba6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Retour utilisateur 2026-09-05 ("c'est moche", capture montrant une tres
     grande zone vide en haut et en bas d'un petit bloc centre) : le contenu
     ne remplit naturellement qu'un tiers de la hauteur du canevas 844px, et
     un canevas "ecran de telephone" a toujours une part de vide autour d'un
     callout court - le vrai probleme n'est pas l'espace en soi mais son
     absence d'intention visuelle. Fix : garde le centrage (juste), ajoute un
     halo/silhouette de fantome en arriere-plan pour que ce vide se lise
     comme un choix de composition plutot qu'un rendu casse/inacheve. */
  body {
    width: 390px; height: 844px; position: relative; overflow: hidden;
    background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .bg-motif {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 50% 18%, rgba(246,241,235,0.05), transparent 40%),
      radial-gradient(circle at 20% 75%, rgba(237,121,64,0.06), transparent 45%),
      radial-gradient(circle at 82% 78%, rgba(234,181,50,0.05), transparent 45%);
  }
  .ghost-watermark {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    font-size: 220px; opacity: 0.05; z-index: 0; line-height: 1;
  }
  .vision-tag, h1, p.sub, .switch-row, .footnote { position: relative; z-index: 1; }
  .vision-tag { position: absolute; top: 24px; left: 0; right: 0; font-size: 10px; color: var(--ink-faint); }
  h1 { font-family: 'Chakra Petch', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  p.sub { font-size: 13px; color: var(--ink-muted); max-width: 260px; margin: 0 auto 40px; line-height: 1.5; }

  .switch-row {
    display: flex; align-items: center; gap: 22px; background: var(--bg-elevated);
    border: 1px solid var(--line); border-radius: 999px; padding: 10px 18px;
  }
  .side { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 90px; }
  .avatar {
    width: 56px; height: 56px; border-radius: 999px; display: flex; align-items: center;
    justify-content: center; font-size: 24px; border: 2px solid transparent;
  }
  .avatar.public { background: linear-gradient(135deg, #ed7940, #eab532); }
  .avatar.ghost {
    background: var(--bg-card); border-color: var(--line); color: var(--ink-muted);
    box-shadow: 0 0 0 6px rgba(246,241,235,0.04);
  }
  .side .label { font-size: 11px; font-weight: 600; color: var(--ink-muted); }
  .side.active .label { color: var(--ink); }

  .track {
    width: 56px; height: 30px; border-radius: 999px; background: var(--bg-card);
    border: 1px solid var(--line); position: relative; flex-shrink: 0;
  }
  .knob {
    position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 999px;
    background: var(--ink-muted); transition: none;
  }
  .track.ghost-on .knob { left: 31px; background: var(--ink); }

  .footnote {
    margin-top: 36px; font-size: 11.5px; color: var(--ink-faint); max-width: 280px; line-height: 1.5;
  }
  .footnote b { color: var(--green); }
</style>
</head>
<body>
  <div class="bg-motif"></div>
  <div class="ghost-watermark">👻</div>
  <div class="vision-tag">Vision — Ghost Mode, anonymat réversible</div>

  <h1>Ton espace, ton rythme</h1>
  <p class="sub">Pas prêt à publier à visage découvert ? Passe en Fantôme — révèle-toi quand tu veux.</p>

  <div class="switch-row">
    <div class="side">
      <div class="avatar public">👤</div>
      <div class="label">Public</div>
    </div>
    <div class="track ghost-on"><div class="knob"></div></div>
    <div class="side active">
      <div class="avatar ghost">👻</div>
      <div class="label">Fantôme</div>
    </div>
  </div>

  <p class="footnote">
    <b>Safe Space :</b> ton identité reste protégée tant que tu ne révèles pas ton post toi-même.
  </p>
</body>
</html>
