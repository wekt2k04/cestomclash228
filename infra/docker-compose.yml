services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindclash
      POSTGRES_PASSWORD: mindclash_dev
      POSTGRES_DB: mindclash
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindclash -d mindclash"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
